<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" role="img" aria-label="Lintel system architecture: Expo Router screens rest on composition modules, which use data clients that carry the Clerk session token to Supabase, where row level security scopes every personal row.">
  <title>Lintel — system architecture</title>

  <rect width="1140" height="720" fill="#faf9f5"/>

  <!-- Masthead -->
  <text x="56" y="58" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#b0aea5">LINTEL</text>
  <text x="56" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#141413">System architecture</text>
  <rect x="56" y="118" width="64" height="3" fill="#d97757"/>
  <text x="56" y="148" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5e5d57">Screens rest on composition modules; every personal query leaves through a client that carries the Clerk session token.</text>

  <!-- ================= ROW 1 — SCREENS ================= -->
  <rect x="56" y="180" width="1028" height="92" rx="10" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <circle cx="80" cy="226" r="3.5" fill="#d97757"/>
  <text x="94" y="230" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#3d3d3a">SCREENS</text>
  <line x1="196" y1="198" x2="196" y2="254" stroke="#e8e6dc" stroke-width="1"/>

  <!-- tab destinations -->
  <rect x="216" y="204" width="84" height="44" rx="6" fill="#f5f3ec" stroke="#e8e6dc" stroke-width="1"/>
