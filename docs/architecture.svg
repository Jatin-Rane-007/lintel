  <rect x="310" y="204" width="84" height="44" rx="6" fill="#f5f3ec" stroke="#e8e6dc" stroke-width="1"/>
  <text x="352" y="231" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#141413">Search</text>
  <rect x="404" y="204" width="84" height="44" rx="6" fill="#f5f3ec" stroke="#e8e6dc" stroke-width="1"/>
