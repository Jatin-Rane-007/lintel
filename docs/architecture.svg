  <rect x="56" y="558" width="1028" height="92" rx="10" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <circle cx="80" cy="604" r="3.5" fill="#d97757"/>
  <text x="94" y="608" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#3d3d3a">SERVICES</text>
  <line x1="196" y1="576" x2="196" y2="632" stroke="#e8e6dc" stroke-width="1"/>

  <rect x="216" y="582" width="96" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="264" y="609" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#141413">Clerk</text>

  <line x1="322" y1="604" x2="352" y2="604" stroke="#d97757" stroke-width="1.5"/>
  <polygon points="351,599.5 351,608.5 358,604" fill="#d97757"/>
  <text x="340" y="594" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9c4124">JWT</text>

  <rect x="368" y="582" width="168" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="452" y="609" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#141413">Supabase Postgres</text>

  <text x="556" y="609" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5e5d57">RLS policies scope every personal row to the signed-in user</text>

  <!-- Footer -->
  <line x1="56" y1="676" x2="1084" y2="676" stroke="#e8e6dc" stroke-width="1"/>
  <text x="56" y="704" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5e5d57">Two clients on purpose: the anon key serves public catalogue reads, the Clerk-scoped one answers "who is asking" for saves and listings.</text>
</svg>
