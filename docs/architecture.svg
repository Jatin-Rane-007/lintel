  <text x="540" y="231" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#141413">Saved</text>
  <rect x="592" y="204" width="84" height="44" rx="6" fill="#f5f3ec" stroke="#e8e6dc" stroke-width="1"/>
  <text x="634" y="231" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#141413">Account</text>

  <line x1="696" y1="198" x2="696" y2="254" stroke="#e8e6dc" stroke-width="1"/>

  <rect x="710" y="204" width="124" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="772" y="231" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">property/[id]</text>
  <rect x="844" y="204" width="112" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="900" y="231" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">property/map</text>
