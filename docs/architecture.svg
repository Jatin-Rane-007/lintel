  <rect x="346" y="330" width="78" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="385" y="357" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">hooks</text>
  <rect x="436" y="330" width="78" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="475" y="357" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">theme</text>
  <rect x="526" y="330" width="78" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="565" y="357" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">store</text>
  <rect x="616" y="330" width="62" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="647" y="357" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">lib</text>

  <text x="700" y="357" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5e5d57">primitives · data hooks · tokens · zustand · clients</text>

  <!-- flow arrows -->
  <line x1="330" y1="404" x2="330" y2="420" stroke="#d97757" stroke-width="1.5"/>
  <polygon points="325.5,419 334.5,419 330,426" fill="#d97757"/>
  <line x1="640" y1="404" x2="640" y2="420" stroke="#d97757" stroke-width="1.5"/>
  <polygon points="635.5,419 644.5,419 640,426" fill="#d97757"/>
  <line x1="950" y1="404" x2="950" y2="420" stroke="#d97757" stroke-width="1.5"/>
  <polygon points="945.5,419 954.5,419 950,426" fill="#d97757"/>

