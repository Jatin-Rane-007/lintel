  <rect x="56" y="432" width="1028" height="92" rx="10" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <circle cx="80" cy="478" r="3.5" fill="#d97757"/>
  <text x="94" y="482" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#3d3d3a">CLIENTS</text>
  <line x1="196" y1="450" x2="196" y2="506" stroke="#e8e6dc" stroke-width="1"/>

  <rect x="216" y="456" width="140" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="286" y="483" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">supabase (anon)</text>
  <rect x="368" y="456" width="214" height="44" rx="6" fill="#f5f3ec" stroke="#d97757" stroke-width="1"/>
  <text x="475" y="483" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#141413">createClerkSupabaseClient()</text>
  <rect x="594" y="456" width="126" height="44" rx="6" fill="#f5f3ec" stroke="#d97757" stroke-width="1"/>
  <text x="657" y="483" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#141413">useSupabase()</text>
  <rect x="732" y="456" width="126" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <text x="795" y="483" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">useUserSync()</text>

  <text x="880" y="483" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5e5d57">memoised per session</text>

  <!-- flow arrows -->
  <line x1="330" y1="530" x2="330" y2="546" stroke="#d97757" stroke-width="1.5"/>
  <polygon points="325.5,545 334.5,545 330,552" fill="#d97757"/>
  <line x1="640" y1="530" x2="640" y2="546" stroke="#d97757" stroke-width="1.5"/>
