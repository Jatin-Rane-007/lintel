  <rect x="56" y="306" width="1028" height="92" rx="10" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
  <circle cx="80" cy="352" r="3.5" fill="#d97757"/>
  <text x="94" y="356" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#3d3d3a">COMPOSITION</text>
  <line x1="196" y1="324" x2="196" y2="380" stroke="#e8e6dc" stroke-width="1"/>

  <rect x="216" y="330" width="118" height="44" rx="6" fill="#ffffff" stroke="#e8e6dc" stroke-width="1"/>
