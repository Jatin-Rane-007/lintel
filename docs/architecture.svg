  <text x="1008" y="231" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3d3d3a">sign-in</text>

  <!-- flow arrows -->
  <line x1="330" y1="278" x2="330" y2="294" stroke="#d97757" stroke-width="1.5"/>
  <polygon points="325.5,293 334.5,293 330,300" fill="#d97757"/>
